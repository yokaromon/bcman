# CT113 (10.0.1.5) の /etc/nginx/sites-available/bcman の原本。
# 公開経路は app.ykr.ltd/bcman/ → CT101 がプレフィックスを剥がして転送してくる。
server {
    listen 80;

    # 名刺写真は数MBある。CT101 側の上限と揃えること。
    client_max_body_size 25m;

    root /opt/bcman/Project/frontend/dist;
    index index.html;

    # ビルドごとにファイル名へハッシュが付くため、中身が変われば URL も変わる。
    # つまり中身が同じ限り永久にキャッシュしてよい。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html だけは毎回問い合わせさせる。Cache-Control が無いとブラウザは
    # Last-Modified からの経過時間で勝手にキャッシュし、ハッシュ付きJSを差し替えても
    # 古い index.html が古いJSを指し続けてデプロイが反映されない（実際に起きた）。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;

        # OCRとLLMを同期で回すため、1リクエストが分単位になることがある
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

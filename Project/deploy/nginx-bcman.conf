# CT113 (10.0.1.5) の /etc/nginx/sites-available/bcman の原本。
# 公開経路は app.ykr.ltd/bcman/ → CT101 がプレフィックスを剥がして転送してくる。

# オフィスの固定IPからのログインをTOTPなしで通す許可リストは、いったん無効化してある
# （2026-08-12）。$remote_addr は CT101 経由だと常に CT101 のIPになるため機能せず、
# X-Forwarded-For の先頭要素に切り替える案は、物理プロキシ .11 がクライアントの
# 送信ヘッダーを上書きしているかを sudo 権限で確認できるまで有効化しない
# （上書きしていなければ誰でもヘッダー偽装でTOTPを回避できてしまうため）。
# 確認が取れたら bcman_trusted_network を $http_x_forwarded_for ベースに戻し、
# 下の X-Trusted-Network 行を $bcman_trusted_network に戻すこと。
geo $bcman_trusted_network {
    default 0;
    # 203.0.113.10/32 1;  # 例: オフィスの固定グローバルIP。実際のIPに置き換えて追加する
}

server {
    listen 80;

    # 名刺写真は数MBある。CT101 側の上限と揃えること。
    client_max_body_size 25m;

    root /opt/bcman/Project/frontend/dist;
    index index.html;

    # ビルドごとにファイル名へハッシュが付くため、中身が変われば URL も変わる。
    # つまり中身が同じ限り永久にキャッシュしてよい。
    # expires と併用すると Cache-Control が2行出るので、add_header だけで書く。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html だけは毎回問い合わせさせる。Cache-Control が無いとブラウザは
    # Last-Modified からの経過時間で勝手にキャッシュし、ハッシュ付きJSを差し替えても
    # 古い index.html が古いJSを指し続けてデプロイが反映されない（実際に起きた）。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # バックエンドはこのヘッダーだけを信じてTOTPを省略するため、ここより外側の
        # 何者か（インターネット上のクライアント含む）に上書きさせてはいけない。
        # バックエンド(127.0.0.1:8000)がnginxを経由せず直接インターネットに公開されて
        # いないことが、この仕組み全体の前提。
        # 上の geo ブロックの説明の通り、現在は常に 0（無効化）を送る。
        proxy_set_header X-Trusted-Network 0;

        # OCRとLLMを同期で回すため、1リクエストが分単位になることがある
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
